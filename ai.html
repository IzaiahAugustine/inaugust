<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izaiah Augustine</title>
    <style>
        body {
            background-color: #ff6a00;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #0b2545;
            font-size: 3em;
            margin-bottom: 20px;
        }
        img {
            width: 200px;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .about-label {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 25px;
            color: #ffffff;
        }
        .bio {
            color: #ffffff;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Izaiah Augustine</h1>
        <img src="me.jpeg" alt="Portrait photo of Izaiah Augustine">
        <div class="about-label">About Me</div>
        <p class="bio">
            Hi, I'm Izaiah, a student who loves learning new things.<br>
            I'm interested in technology and how it shapes the world.<br>
            In my free time, I enjoy sports, music, and spending time with friends.
        </p>
    </div>
</body>
</html>
